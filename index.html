<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Candlestick Chart Viewer</title>
  <script src="https://unpkg.com/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.min.js"></script>
<!-- <script src="https://unpkg.com/chartjs-chart-financial@3.3.0/dist/chartjs-chart-financial.min.js"></script> -->
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    input {
      margin: 10px;
      width: 80px;
    }
    button {
      padding: 5px 10px;
    }
    canvas {
      margin-top: 20px;
      max-width: 800px;
    }
  </style>
</head>
<body>

  <h2>Visualize One Candlestick</h2>

  <div>
    <label>Open: <input type="number" id="open" value="100.0" step="0.1"></label>
    <label>High: <input type="number" id="high" value="100.1" step="0.1"></label>
    <label>Low: <input type="number" id="low" value="95.0" step="0.1"></label>
    <label>Close: <input type="number" id="close" value="101.0" step="0.1"></label>
    <button onclick="drawCandle()">Draw</button>
  </div>

  <canvas id="candlestickChart" height="300"></canvas>

  <script>
    const ctx = document.getElementById('candlestickChart').getContext('2d');

    const chart = new Chart(ctx, {
      type: 'candlestick',
      data: {
        datasets: [{
          label: 'Candlestick',
          data: []
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            type: 'time',
            time: {
              unit: 'minute'
            }
          },
          y: {
            beginAtZero: false
          }
        }
      }
    });

    function drawCandle() {
      const open = parseFloat(document.getElementById('open').value);
      const high = parseFloat(document.getElementById('high').value);
      const low = parseFloat(document.getElementById('low').value);
      const close = parseFloat(document.getElementById('close').value);

      chart.data.datasets[0].data = [{
        x: new Date(),
        o: open,
        h: high,
        l: low,
        c: close
      }];
      chart.update();
    }

    // Draw the initial candle
    drawCandle();
  </script>

</body>
</html>
